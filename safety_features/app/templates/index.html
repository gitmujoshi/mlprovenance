<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPT-2 Model Testing Interface</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">GPT-2 Model Testing Interface</h1>
        
        <!-- Model Information -->
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">Model Information</h5>
            </div>
            <div class="card-body">
                <div id="modelInfo">Loading model information...</div>
            </div>
        </div>

        <!-- Input Form -->
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">Generate Text</h5>
            </div>
            <div class="card-body">
                <form id="generateForm">
                    <div class="mb-3">
                        <label for="prompt" class="form-label">Enter your prompt:</label>
                        <textarea class="form-control" id="prompt" rows="3" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Generate</button>
                </form>
            </div>
        </div>

        <!-- Results -->
        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">Generated Text</h5>
            </div>
            <div class="card-body">
                <div id="generatedText" class="mb-3"></div>
                <div id="safetyResults" class="mt-3">
                    <h6>Safety Check Results:</h6>
                    <div id="safetyDetails"></div>
                </div>
            </div>
        </div>

        <!-- Error Messages -->
        <div id="errorAlert" class="alert alert-danger d-none" role="alert"></div>
    </div>

    <script>
        // Load model information
        fetch('/model-info')
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    document.getElementById('modelInfo').innerHTML = `<div class="alert alert-warning">${data.error}</div>`;
                } else {
                    const modelInfo = `
                        <p><strong>Model Path:</strong> ${data.model_path}</p>
                        <p><strong>Last Modified:</strong> ${new Date(data.last_modified).toLocaleString()}</p>
                        ${data.provenance ? `
                            <h6>Training Information:</h6>
                            <ul>
                                <li>Epochs: ${data.provenance.training_metrics.epochs}</li>
                                <li>Batch Size: ${data.provenance.training_metrics.batch_size}</li>
                                <li>Final Loss: ${data.provenance.training_metrics.final_loss.toFixed(4)}</li>
                            </ul>
                        ` : ''}
                    `;
                    document.getElementById('modelInfo').innerHTML = modelInfo;
                }
            })
            .catch(error => {
                document.getElementById('modelInfo').innerHTML = `<div class="alert alert-danger">Error loading model information: ${error}</div>`;
            });

        // Handle form submission
        document.getElementById('generateForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const prompt = document.getElementById('prompt').value;
            const errorAlert = document.getElementById('errorAlert');
            const generatedText = document.getElementById('generatedText');
            const safetyDetails = document.getElementById('safetyDetails');
            
            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ prompt }),
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Failed to generate text');
                }
                
                // Display generated text
                generatedText.innerHTML = `<p class="lead">${data.generated_text}</p>`;
                
                // Display safety results
                const safetyResult = data.safety_result;
                let safetyHtml = `
                    <div class="alert ${safetyResult.passes_checks ? 'alert-success' : 'alert-danger'}">
                        <strong>Safety Check:</strong> ${safetyResult.passes_checks ? 'Passed' : 'Failed'}
                    </div>
                `;
                
                if (safetyResult.warnings.length > 0) {
                    safetyHtml += `
                        <div class="alert alert-warning">
                            <strong>Warnings:</strong>
                            <ul>
                                ${safetyResult.warnings.map(w => `<li>${w}</li>`).join('')}
                            </ul>
                        </div>
                    `;
                }
                
                if (safetyResult.violations.length > 0) {
                    safetyHtml += `
                        <div class="alert alert-danger">
                            <strong>Violations:</strong>
                            <ul>
                                ${safetyResult.violations.map(v => `<li>${v}</li>`).join('')}
                            </ul>
                        </div>
                    `;
                }
                
                safetyDetails.innerHTML = safetyHtml;
                errorAlert.classList.add('d-none');
                
            } catch (error) {
                errorAlert.textContent = error.message;
                errorAlert.classList.remove('d-none');
                generatedText.innerHTML = '';
                safetyDetails.innerHTML = '';
            }
        });
    </script>
</body>
</html>
